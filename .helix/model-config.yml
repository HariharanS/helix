# Helix Model Configuration
# Default model assignments per tier. Each agent's frontmatter contains its model.
# To override: edit the agent's .agent.md frontmatter `model` field.
#
# IMPORTANT: The task() CLI tool does NOT auto-apply agent frontmatter models.
# Callers MUST pass model: explicitly using the task_ids values below.

tiers:
  reasoning: Claude Opus 4.6 (copilot)       # Creative, strategic, design
  coding: GPT-5.3-Codex (copilot)             # Code generation, tests
  analysis: GPT-5.4 (copilot)                 # Review, routing, decomposition, orchestration
  visual: Gemini 3.1 Pro (Preview) (copilot)  # UI testing, visual understanding
  fast: Claude Haiku 4.5 (copilot)            # Exploration, summaries, state mgmt

# task() CLI model IDs — pass these as `model:` when calling task().
# Agent frontmatter friendly names are NOT accepted by task(); use these short IDs.
task_ids:
  reasoning: claude-opus-4.6
  coding: gpt-5.3-codex
  analysis: gpt-5.4
  fast: claude-haiku-4.5
  visual_cli_fallback: gpt-5.4  # Gemini not available in CLI task() tool; loses image-native capability

assignments:
  # Router/setup agents use analysis: they choose deterministic script/agent
  # paths and handle failures, but should not spend reasoning-tier budget.
  helix: analysis
  setup: analysis
  scribe: fast
  # Product and architecture shaping stay on reasoning-tier models because they
  # resolve ambiguity, scope, domain tradeoffs, and cross-repo contracts.
  jam: reasoning
  planner: reasoning
  architect: reasoning
  decomposer: analysis
  # Read-only gathering and compact state work should stay cheap unless a
  # caller explicitly escalates for a hard investigation.
  explorer: fast
  implementer: coding
  tdd-red: coding
  reviewer: analysis
  distiller: fast
  resume: fast
  # Visual tier is reserved for image/browser reasoning. Green-path UI test
  # runs should be shell commands, not model invocations.
  ui-tester: visual
